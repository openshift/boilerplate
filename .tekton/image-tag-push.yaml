apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/boilerplate?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/image-v*]"
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: boilerplate-master
    appstudio.openshift.io/component: image
    pipelines.appstudio.openshift.io/type: build
  name: image-on-tag-push
  namespace: boilerplate-cicada-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/boilerplate-cicada-tenant/boilerplate-master/image:{{revision}}
    - name: build-platforms
      value:
        - linux/amd64
        - linux/arm64
    - name: build-image-index
      value: 'true'
    - name: dockerfile
      value: config/Dockerfile
    - name: build-source-image
      value: 'true'
    - name: build-args
      value:
        - "VERSION={{ git_tag }}"
  taskRunSpecs:
    - computeResources:
        limits:
          memory: 4Gi
      pipelineTaskName: build-images
    - computeResources:
        limits:
          memory: 4Gi
      pipelineTaskName: ecosystem-cert-preflight-checks
  taskRunTemplate:
    serviceAccountName: build-pipeline-image
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        metadata:
          creationTimestamp:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
        status: {}
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
  pipelineRef:
    resolver: bundles
    params:
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/pipeline-docker-build-multi-platform-oci-ta:36b2adfb556e9a9cbda16f33d99907ca1204078e@sha256:587a6c6d4834bdbb21192027b5e87c60371438e4209ba5470f06528460069cb5
      - name: name
        value: docker-build-multi-platform-oci-ta
      - name: kind
        value: pipeline
status: {}
