name: Tag image on Dockerfile changes

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Create an image release even when config/Dockerfile has not changed since the previous image tag."
        required: false
        default: false
        type: boolean
      tag_override:
        description: "Use this tag instead of the automatically generated image-vYYYYMMDD tag."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: image-tag-master
  cancel-in-progress: false

jobs:
  tag-image:
    if: github.repository == 'openshift/boilerplate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Tag Dockerfile changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          TAG_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_override || '' }}
        run: |
          set -euo pipefail

          # Refresh master and tags so the tag is created from the latest branch tip.
          git fetch --force --tags origin "+refs/heads/master:refs/remotes/origin/master"
          git checkout --detach origin/master

          today_tag="image-v$(date -u +%Y%m%d)"
          release_tag="${TAG_OVERRIDE:-${today_tag}}"

          # A scheduled run and a manual retry on the same UTC date must be harmless.
          if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
            tag_commit=$(git rev-parse "${release_tag}^{commit}")
            if git merge-base --is-ancestor "${tag_commit}" origin/master; then
              echo "${release_tag} already exists on master; nothing to do."
              exit 0
            fi

            echo "${release_tag} exists but does not point to master history." >&2
            exit 1
          fi

          if [[ "${FORCE_RELEASE}" == "true" ]]; then
            echo "Force release requested; skipping the Dockerfile history check."
          else
            baseline_tag=$(git describe --tags --abbrev=0 --match 'image-v*' origin/master || true)
            if [[ -z "${baseline_tag}" ]]; then
              echo "No reachable image-v* baseline tag exists on master." >&2
              exit 1
            fi

            dockerfile_commit=$(git log -1 --format='%H' "${baseline_tag}..origin/master" -- config/Dockerfile)
            if [[ -z "${dockerfile_commit}" ]]; then
              echo "No commit since ${baseline_tag} touched config/Dockerfile."
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${release_tag}" --message "Automated image release ${release_tag}" HEAD
          git push origin "refs/tags/${release_tag}"
          gh release create "${release_tag}" \
            --title "${release_tag}" \
            --generate-notes
